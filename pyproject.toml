[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultratribe"
version = "4.0.0"
description = "Enterprise Multi-Modal Neural Brain Encoding Framework"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "UltraTribe Team"}]

dependencies = [
  "torch>=2.5",
  "numpy>=2.0",
  "scipy",
  "pydantic>=2.0",
  "pyyaml",
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "einops",
  "pandas",
]

[project.scripts]
ultratribe-mcp = "ultratribe.mcp.server:main"

[project.optional-dependencies]
viz = [
  "nibabel",
  "matplotlib",
  "seaborn",
  "nilearn",
  "pyvista",
]
serve = [
  "fastapi",
  "uvicorn[standard]",
  "redis",
]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["ultratribe*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
